name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Signed release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'eeee0717/BabelDOC'
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/babeldoc-stream
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}

      - name: Setup uv with Python 3.12
        uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          python-version: "3.12"
          enable-cache: true
          activate-environment: true

      - name: Install dependencies
        run: uv sync

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          package_version="$(uv run python -c 'import babeldoc; print(babeldoc.__version__)')"
          test "${RELEASE_TAG}" = "v${package_version}"

      - name: Check
        run: |
          uv run ruff check .
          uv run ruff format --check babeldoc/main.py babeldoc/progress_json.py tests
          uv run pytest

      - name: Build distributions
        run: uv build

      - name: Publish distributions
        run: uv publish --trusted-publishing always dist/*
